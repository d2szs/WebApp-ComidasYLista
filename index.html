<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario de comidas</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- Pantalla de configuración: claves sin definir o Supabase sin respuesta -->
  <section id="screen-config" class="screen screen-centered" hidden>
    <div class="card">
      <h1>No se puede conectar</h1>
      <p id="config-message"></p>
      <button type="button" id="config-retry" class="btn btn-primary">Reintentar</button>
    </div>
  </section>

  <!-- Pantalla inicial mientras se comprueba la sesión -->
  <section id="screen-start" class="screen screen-centered">
    <div class="loading-text">Cargando…</div>
  </section>

  <!-- Inicio de sesión -->
  <section id="screen-login" class="screen screen-centered" hidden>
    <form id="form-login" class="card" novalidate>
      <h1>Calendario de comidas</h1>
      <label class="field">
        <span>Email</span>
        <input type="email" id="login-email" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error-message" hidden></p>
      <p id="login-info" class="info-message" hidden></p>
      <button type="submit" id="login-button" class="btn btn-primary btn-wide">Entrar</button>
      <button type="button" id="forgot-button" class="btn btn-text btn-centered">¿Has olvidado la contraseña?</button>
    </form>

    <!-- Recuperación de la contraseña: se alterna con el formulario de login -->
    <form id="form-recovery" class="card" novalidate hidden>
      <h1>Calendario de comidas</h1>
      <label class="field">
        <span>Email</span>
        <input type="email" id="recovery-email" autocomplete="username" required>
      </label>
      <p id="recovery-error" class="error-message" hidden></p>
      <p id="recovery-info" class="info-message" hidden></p>
      <button type="submit" id="recovery-button" class="btn btn-primary btn-wide">Enviar enlace</button>
      <button type="button" id="recovery-back" class="btn btn-centered">Volver</button>
    </form>
  </section>

  <!-- Nueva contraseña: solo se llega con un enlace de recuperación válido -->
  <section id="screen-new-password" class="screen screen-centered" hidden>
    <form id="form-new-password" class="card" novalidate>
      <h1>Calendario de comidas</h1>
      <p id="new-password-account">Cambiando la contraseña de <strong id="new-password-email"></strong></p>
      <label class="field">
        <span>Contraseña nueva</span>
        <input type="password" id="new-password" autocomplete="new-password" required>
      </label>
      <label class="field">
        <span>Repite la contraseña</span>
        <input type="password" id="new-password-repeat" autocomplete="new-password" required>
      </label>
      <p id="new-password-error" class="error-message" hidden></p>
      <div class="dialog-buttons">
        <button type="button" id="new-password-cancel" class="btn">Cancelar</button>
        <button type="submit" id="new-password-save" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </section>

  <!-- Aplicación -->
  <section id="screen-app" class="screen" data-screen="meals" hidden>
    <header class="header">
      <div class="header-row">
        <h1 id="app-title" class="app-title">Comidas</h1>
        <button type="button" id="logout-button" class="btn btn-text">Cerrar sesión</button>
      </div>
      <div class="view-selector" role="group" aria-label="Vista">
        <button type="button" class="view-button" data-view="month">Mes</button>
        <button type="button" class="view-button" data-view="week">Semana</button>
        <button type="button" class="view-button" data-view="day">Día</button>
      </div>
      <div class="navigation">
        <button type="button" id="prev-button" class="btn btn-icon" aria-label="Anterior">‹</button>
        <button type="button" id="today-button" class="btn">Hoy</button>
        <button type="button" id="next-button" class="btn btn-icon" aria-label="Siguiente">›</button>
        <button type="button" id="period-button" class="period-button" aria-haspopup="dialog" aria-expanded="false">
          <span id="period-title" class="period-title"></span>
          <span class="period-arrow" aria-hidden="true">▾</span>
        </button>
      </div>
      <!-- Barra de pantallas (007 RF-1): arriba en el pc, fija abajo en el móvil -->
      <nav class="screen-bar" aria-label="Pantalla">
        <button type="button" class="screen-button active" data-screen="meals" aria-current="page">Comidas</button>
        <button type="button" class="screen-button" data-screen="list">Compra</button>
      </nav>
    </header>

    <dialog id="month-panel" class="month-panel" aria-label="Elegir mes">
      <div class="panel-year-row">
        <button type="button" id="panel-prev" class="btn btn-icon" aria-label="Año anterior">‹</button>
        <span id="panel-year" class="panel-year"></span>
        <button type="button" id="panel-next" class="btn btn-icon" aria-label="Año siguiente">›</button>
      </div>
      <div id="panel-months" class="panel-months"></div>
    </dialog>

    <div id="error-notice" class="error-notice" role="alert" hidden>
      <span id="error-notice-text"></span>
      <button type="button" id="error-notice-close" class="btn-text" aria-label="Cerrar aviso">✕</button>
    </div>
    <div id="loading-indicator" class="loading-indicator" hidden>Cargando…</div>

    <main id="calendar" class="calendar"></main>

    <!-- Pantalla Compra (007 RF-6): campo rápido, Por comprar y Guardados -->
    <main id="shopping" class="shopping">
      <form id="quick-add" class="quick-add" novalidate>
        <input type="text" id="quick-add-input" maxlength="200" placeholder="Añadir artículo..." aria-label="Añadir artículo" autocomplete="off" enterkeyhint="done">
        <button type="submit" id="quick-add-button" class="btn btn-primary quick-add-button" aria-label="Añadir">+</button>
      </form>

      <div id="list-loading" class="list-loading" hidden>Cargando…</div>

      <div id="list-content">
        <section class="list-section" aria-labelledby="pending-title">
          <h2 id="pending-title" class="list-title">Por comprar (0)</h2>
          <ul id="pending-list" class="article-list"></ul>
          <p id="pending-empty" class="list-empty" hidden>No hay nada por comprar.</p>
          <div class="finish-row">
            <button type="button" id="finish-button" class="btn" hidden>Terminar compra</button>
          </div>
        </section>

        <section class="list-section">
          <h2 class="list-title">
            <button type="button" id="saved-toggle" class="saved-toggle" aria-expanded="false" aria-controls="saved-body">
              <span class="saved-arrow" aria-hidden="true">▸</span>
              <span id="saved-title">Guardados (0)</span>
            </button>
          </h2>
          <div id="saved-body" hidden>
            <ul id="saved-list" class="article-list"></ul>
            <p id="saved-empty" class="list-empty" hidden>Aquí aparecerán los artículos comprados.</p>
          </div>
        </section>
      </div>
    </main>

    <button type="button" id="add-button" class="btn btn-primary btn-floating">+ Añadir comida</button>
    <button type="button" id="add-article-button" class="btn btn-primary btn-floating">+ Añadir artículo</button>
  </section>

  <!-- Formulario de comida -->
  <dialog id="meal-dialog" class="dialog">
    <form id="meal-form" novalidate>
      <h2 id="form-title">Añadir comida</h2>
      <p id="form-match-notice" class="alert-message" role="status" hidden><span class="alert-icon" aria-hidden="true">⚠︎</span><span id="form-match-text"></span></p>
      <p id="form-notice" class="info-message" hidden></p>

      <label class="field">
        <span>Fecha</span>
        <input type="date" id="form-date" required>
      </label>

      <div class="field">
        <span>Tipo</span>
        <div class="type-selector" role="group" aria-label="Tipo de comida">
          <button type="button" class="type-button" data-type="desayuno">Desayuno</button>
          <button type="button" class="type-button" data-type="comida">Comida</button>
          <button type="button" class="type-button" data-type="cena">Cena</button>
        </div>
      </div>

      <div id="form-dish-1"></div>
      <div id="form-dish-2"></div>

      <p id="form-error" class="error-message" hidden></p>
      <button type="button" id="form-remove-second" class="btn btn-danger" hidden>Eliminar segundo plato</button>

      <div class="dialog-buttons">
        <button type="button" id="form-cancel" class="btn">Cancelar</button>
        <button type="submit" id="form-save" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmaciones -->
  <dialog id="confirm-dialog" class="dialog dialog-small">
    <p id="confirm-text"></p>
    <div class="dialog-buttons">
      <button type="button" id="confirm-no" class="btn">Cancelar</button>
      <button type="button" id="confirm-yes" class="btn btn-danger">Aceptar</button>
    </div>
  </dialog>

  <!-- Plantilla de un plato del formulario -->
  <template id="dish-template">
    <fieldset class="dish">
      <legend class="dish-title"></legend>
      <label class="field">
        <span class="dish-name-label">Nombre de receta</span>
        <input type="text" class="dish-name" maxlength="200">
      </label>
      <div class="field">
        <span>Ingredientes</span>
        <div class="ingredients"></div>
        <button type="button" class="btn btn-text dish-add-ingredient">+ Añadir ingrediente</button>
      </div>
      <label class="field">
        <span>Receta</span>
        <textarea class="dish-recipe" rows="4"></textarea>
      </label>
      <label class="field">
        <span>Referencia (enlace web)</span>
        <input type="url" class="dish-reference" placeholder="https://…">
      </label>
    </fieldset>
  </template>

  <!-- Plantilla de una fila de ingrediente -->
  <template id="ingredient-template">
    <div class="ingredient">
      <textarea class="ingredient-name" rows="1" placeholder="Ingrediente" aria-label="Ingrediente" enterkeyhint="go"></textarea>
      <input type="number" class="ingredient-quantity" placeholder="Cant." min="0" step="any" inputmode="decimal" aria-label="Cantidad">
      <select class="ingredient-unit" aria-label="Unidad">
        <option value="">—</option>
        <option value="und">und.</option>
        <option value="kg">kg.</option>
        <option value="gr">gr.</option>
      </select>
      <button type="button" class="btn btn-icon ingredient-remove" aria-label="Quitar ingrediente">✕</button>
    </div>
  </template>

  <!-- supabase-js v2.117.2 (UMD), descargado de jsDelivr -->
  <script src="./supabase.js"></script>
  <script src="./logic.js"></script>
  <script src="./app.js"></script>
</body>
</html>
